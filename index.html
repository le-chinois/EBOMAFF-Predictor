<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EBOMAFF Predictor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#060812;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:480px;
  margin:auto;
  padding:18px 15px 35px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.brand{
  font-size:17px;
  font-weight:900;
}

.online{
  color:#4cff9a;
  font-size:12px;
  font-weight:800;
}

.card{
  background:#101326;
  border:1px solid #292d43;
  border-radius:25px;
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.top h2{
  font-size:21px;
}

.ai{
  font-size:10px;
  color:#bbb;
  background:#ffffff0d;
  padding:8px 11px;
  border-radius:20px;
}

/* =========================
   LUCKY JET
========================= */

.lucky{
  height:390px;
  margin:0 15px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  text-align:center;

  background:
    radial-gradient(
      circle at 50% 53%,
      #521988 0%,
      #2c1255 35%,
      #100c27 62%,
      #070812 100%
    );
}

.stars{
  position:absolute;
  inset:0;
  opacity:.35;

  background-image:
    radial-gradient(#fff 1px,transparent 1px);

  background-size:42px 42px;
}

.logo{
  position:absolute;
  z-index:10;
  top:22px;
  left:0;
  right:0;

  font-size:31px;
  font-weight:950;
  font-style:italic;
  letter-spacing:-2px;

  color:#bc4cff;

  text-shadow:
    0 0 12px #a43cff,
    0 0 28px #6b1ddf;
}

.logo span{
  color:#fff;
}

.value{
  position:absolute;
  z-index:10;

  top:91px;
  left:0;
  right:0;

  font-size:63px;
  line-height:1;
  font-weight:950;

  color:#d47cff;

  text-shadow:
    0 0 12px #bd4cff,
    0 0 32px #7c2cff;
}

.value small{
  font-size:34px;
}

.glow{
  position:absolute;
  z-index:1;

  width:230px;
  height:230px;

  top:110px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:#8336ff;

  opacity:.20;
  filter:blur(35px);
}

.lucky-character{
  position:absolute;
  z-index:7;

  top:155px;
  left:50%;

  width:185px;
  max-height:190px;
  height:auto;

  transform:translateX(-50%);

  object-fit:contain;

  filter:
    drop-shadow(0 13px 12px rgba(0,0,0,.65))
    drop-shadow(0 0 17px rgba(146,66,255,.55));
}

.arc{
  position:absolute;
  z-index:3;

  width:440px;
  height:180px;

  left:-65px;
  bottom:-74px;

  border-top:7px solid #8246f5;
  border-radius:50%;

  transform:rotate(-9deg);

  box-shadow:
    0 -7px 20px #8245ff77,
    0 -18px 50px #6b32d955;
}

.cloud{
  position:absolute;
  z-index:4;

  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      #6942c9,
      #3c257f
    );

  box-shadow:0 0 30px #6838d755;
}

.c1{
  width:180px;
  height:95px;
  left:-50px;
  bottom:-32px;
}

.c2{
  width:230px;
  height:115px;
  left:95px;
  bottom:-70px;
}

.c3{
  width:190px;
  height:100px;
  right:-60px;
  bottom:-30px;
}

.caption{
  position:absolute;
  z-index:12;

  bottom:17px;
  left:0;
  right:0;

  text-align:center;

  color:#dacbff;

  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
}

/* =========================
   MINES CLASSIC
========================= */

.mines-screen{
  display:none;

  margin:0 15px;

  min-height:520px;

  border-radius:22px;

  overflow:hidden;

  position:relative;

  padding:20px 16px 24px;

  background:
    radial-gradient(
      circle at 50% 55%,
      #087bdc 0%,
      #045cc9 42%,
      #003eaa 75%,
      #002b82 100%
    );

  box-shadow:
    inset 0 0 45px rgba(0,229,255,.28);
}

.mines-screen.active{
  display:block;
}

.mines-title{
  text-align:center;

  font-size:25px;
  font-weight:950;

  margin:2px 0 6px;

  text-shadow:
    0 0 12px #64e8ff,
    0 0 25px #00aaff;
}

.mines-subtitle{
  text-align:center;

  font-size:12px;

  color:#ccefff;

  margin-bottom:22px;
}

/* GRILLE */

.mines-board{
  width:100%;

  max-width:335px;

  margin:0 auto 22px;

  padding:10px;

  display:grid;

  grid-template-columns:repeat(5,1fr);

  gap:7px;

  border:4px solid #e4f8ff;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #1474d8,
      #4a69d9
    );

  box-shadow:
    0 0 8px white,
    0 0 20px #8cf5ff,
    0 0 38px rgba(0,225,255,.65);
}

.mine-cell{
  aspect-ratio:1/1;

  border:2px solid #1277ce;

  border-radius:7px;

  background:
    linear-gradient(
      180deg,
      #0360b5,
      #034892
    );

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.12),
    0 3px 4px rgba(0,0,0,.25);

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;
}

.mine-cell::after{
  content:"";

  width:15px;
  height:15px;

  border-radius:50%;

  background:#16bde7;

  box-shadow:
    inset 0 0 4px #67eaff,
    0 0 5px #02bce9;
}

/* ÉTOILE */

.mine-cell.star{
  background:
    linear-gradient(
      180deg,
      #ffdc22,
      #ff9d00
    );

  border-color:#fff1a3;

  box-shadow:
    0 0 8px #fff,
    0 0 16px #ffd500;
}

.mine-cell.star::after{
  content:"★";

  width:auto;
  height:auto;

  background:none;

  color:white;

  font-size:32px;

  line-height:1;

  text-shadow:
    0 0 5px white,
    0 0 10px #fff;
}

/* PIÈGES */

.trap-title{
  text-align:center;

  font-size:16px;

  font-weight:900;

  margin:4px 0 12px;

  text-shadow:0 0 10px #52ff9a;
}

.traps{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;

  max-width:335px;

  margin:auto;
}

.trap{
  border:2px solid #c7f4ff;

  border-radius:13px;

  padding:10px 2px;

  color:white;

  background:
    linear-gradient(
      180deg,
      #0677ce,
      #07549e
    );

  font-size:15px;

  font-weight:900;

  box-shadow:
    0 0 8px rgba(105,230,255,.45);
}

.trap.active{
  color:#333;

  background:
    linear-gradient(
      180deg,
      #fff,
      #e9f8ff
    );

  box-shadow:
    0 0 10px white,
    0 0 18px #6effff;
}

/* =========================
   STATUS
========================= */

.status{
  padding:15px 18px 8px;

  color:#a5a8b8;

  font-size:12px;
}

/* =========================
   PRÉDIRE
========================= */

.predict{
  display:block;

  width:calc(100% - 30px);

  margin:7px 15px 18px;

  padding:16px;

  border:0;

  border-radius:15px;

  color:#fff;

  font-size:16px;

  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #7130ff,
      #b93eff
    );

  box-shadow:
    0 10px 25px rgba(126,47,255,.25);
}

.predict.mines-mode{
  color:#13203b;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #ffe923
    );

  box-shadow:
    0 0 10px #fff,
    0 0 25px rgba(255,235,0,.55);
}

.predict:active{
  transform:scale(.98);
}

.predict:disabled{
  opacity:.65;
}

/* =========================
   LISTE JEUX
========================= */

.title{
  margin:24px 2px 12px;

  color:#a9adbd;

  font-size:12px;

  font-weight:800;
}

.games{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.game{
  padding:14px 5px;

  border-radius:14px;

  border:1px solid #292e42;

  background:#121625;

  color:#fff;

  font-size:13px;

  font-weight:800;
}

.game.active{
  background:
    linear-gradient(
      90deg,
      #5622a8,
      #8435dd
    );

  border-color:#a15cff;
}

.game.mines-active{
  background:
    linear-gradient(
      90deg,
      #006bd1,
      #00a9e8
    );

  border-color:#68eaff;
}

footer{
  margin-top:22px;

  text-align:center;

  color:#6e7387;

  font-size:11px;

  line-height:1.6;
}

/* =========================
   MOBILE
========================= */

@media(max-width:360px){

  .lucky{
    height:370px;
  }

  .logo{
    font-size:28px;
  }

  .value{
    font-size:57px;
  }

  .lucky-character{
    width:165px;
  }

  .mine-cell.star::after{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">
    🤖 EBOMAFF PREDICTOR
  </div>

  <div class="online">
    ● ONLINE
  </div>

</header>

<div class="card">

  <div class="top">

    <h2 id="gameTitle">
      LUCKY JET
    </h2>

    <div class="ai">
      EBOMAFF AI
    </div>

  </div>

  <!-- ======================
       LUCKY JET
  ======================= -->

  <div
    id="luckyScreen"
    class="lucky"
  >

    <div class="stars"></div>

    <div class="logo">
      LUCKY<span>JET</span>
    </div>

    <div
      id="predictionValue"
      class="value"
    >
      --<small>x</small>
    </div>

    <div class="glow"></div>

    <img
      class="lucky-character"
      src="./luckyjet.png"
      alt="Lucky Jet"
    >

    <div class="arc"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="caption">
      PROCHAINE PRÉDICTION
    </div>

  </div>

  <!-- ======================
       MINES CLASSIC
  ======================= -->

  <div
    id="minesScreen"
    class="mines-screen"
  >

    <div class="mines-title">
      💣 MINES
    </div>

    <div class="mines-subtitle">
      EBOMAFF MINI-APPLICATION
    </div>

    <div
      id="minesBoard"
      class="mines-board"
    >

      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>

      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>

      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>

      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>

      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>
      <div class="mine-cell"></div>

    </div>

    <div class="trap-title">
      💣 SÉLECTION DE PIÈGES
    </div>

    <div class="traps">

      <button
        class="trap"
        data-traps="1"
      >
        1
      </button>

      <button
        class="trap"
        data-traps="2"
      >
        2
      </button>

      <button
        class="trap active"
        data-traps="3"
      >
        3
      </button>

      <button
        class="trap"
        data-traps="4"
      >
        4
      </button>

      <button
        class="trap"
        data-traps="5"
      >
        5
      </button>

      <button
        class="trap"
        data-traps="6"
      >
        6
      </button>

      <button
        class="trap"
        data-traps="7"
      >
        7
      </button>

      <button
        class="trap"
        data-traps="8"
      >
        8
      </button>

    </div>

  </div>

  <div
    id="status"
    class="status"
  >
    ⌛ Moteur de prédiction non connecté.
  </div>

  <button
    id="predict"
    class="predict"
  >
    🔎 PRÉDIRE
  </button>

</div>

<div class="title">
  🎮 CHOISIR UN JEU
</div>

<div class="games">

  <button
    id="luckyButton"
    class="game active"
  >
    🚀 Lucky Jet
  </button>

  <button class="game">
    ✈️ Aviator
  </button>

  <button class="game">
    💥 Crash
  </button>

  <button class="game">
    👑 Rocket Queen
  </button>

  <button
    id="minesButton"
    class="game"
  >
    💣 Mines Classic
  </button>

  <button class="game">
    📈 Limbo
  </button>

  <button class="game">
    ⚽ Penalty
  </button>

  <button class="game">
    🚀 Rocket X
  </button>

  <button class="game">
    🏎️ Speed & Cash
  </button>

  <button class="game">
    🐔 Chicken Train
  </button>

</div>

<footer>
  EBOMAFF Robot Prediction 🤖
  <br>
  Moteur d'analyse EBOMAFF
</footer>

</div>

<script>

const predict =
  document.getElementById("predict");

const status =
  document.getElementById("status");

const gameTitle =
  document.getElementById("gameTitle");

const luckyScreen =
  document.getElementById("luckyScreen");

const minesScreen =
  document.getElementById("minesScreen");

const luckyButton =
  document.getElementById("luckyButton");

const minesButton =
  document.getElementById("minesButton");

let currentGame="luckyjet";

let selectedTraps=3;


/* =========================
   OUVRIR LUCKY JET
========================= */

luckyButton.onclick=function(){

  currentGame="luckyjet";

  gameTitle.textContent=
    "LUCKY JET";

  luckyScreen.style.display=
    "block";

  minesScreen.classList.remove(
    "active"
  );

  luckyButton.classList.add(
    "active"
  );

  luckyButton.classList.remove(
    "mines-active"
  );

  minesButton.classList.remove(
    "active",
    "mines-active"
  );

  predict.classList.remove(
    "mines-mode"
  );

  status.textContent=
    "⌛ Moteur de prédiction non connecté.";

};


/* =========================
   OUVRIR MINES
========================= */

minesButton.onclick=function(){

  currentGame="mines";

  gameTitle.textContent=
    "MINES CLASSIC";

  luckyScreen.style.display=
    "none";

  minesScreen.classList.add(
    "active"
  );

  luckyButton.classList.remove(
    "active"
  );

  minesButton.classList.add(
    "mines-active"
  );

  predict.classList.add(
    "mines-mode"
  );

  status.textContent=
    "💣 Sélectionne le nombre de pièges.";

};


/* =========================
   CHOIX PIÈGES
========================= */

document
.querySelectorAll(".trap")
.forEach(function(button){

  button.onclick=function(){

    document
    .querySelectorAll(".trap")
    .forEach(function(item){

      item.classList.remove(
        "active"
      );

    });

    button.classList.add(
      "active"
    );

    selectedTraps=
      Number(
        button.dataset.traps
      );

    status.textContent=
      "💣 Pièges sélectionnés : "
      + selectedTraps;

  };

});


/* =========================
   BOUTON PRÉDIRE
========================= */

predict.onclick=function(){

  predict.disabled=true;

  if(currentGame==="mines"){

    status.textContent=
      "🔎 Analyse Mines en attente du moteur EBOMAFF...";

  }else{

    status.textContent=
      "🔎 Connexion au moteur d'analyse EBOMAFF...";

  }

  setTimeout(function(){

    if(currentGame==="mines"){

      status.textContent=
        "⌛ Moteur Mines non connecté.";

    }else{

      status.textContent=
        "⌛ Moteur de prédiction non connecté.";

    }

    predict.disabled=false;

  },900);

};

</script>

</body>
</html>
