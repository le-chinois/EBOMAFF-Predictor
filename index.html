<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EBOMAFF Predictor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:#060812;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:480px;
  margin:auto;
  padding:18px 15px 35px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.brand{
  font-size:17px;
  font-weight:900;
}

.online{
  color:#4cff9a;
  font-size:12px;
  font-weight:bold;
}

.card{
  background:#101326;
  border:1px solid #292d43;
  border-radius:25px;
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.top h2{
  font-size:21px;
}

.ai{
  font-size:10px;
  color:#bbb;
  background:#ffffff0d;
  padding:8px 11px;
  border-radius:20px;
}

/* LUCKY JET */

.lucky{
  height:390px;
  margin:0 15px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at 50% 55%,#4b197c 0%,#241145 38%,#090916 78%);
}

.stars{
  position:absolute;
  inset:0;
  opacity:.3;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:40px 40px;
}

.logo{
  position:absolute;
  top:25px;
  left:0;
  right:0;
  z-index:5;
  font-size:32px;
  font-weight:900;
  font-style:italic;
  color:#bd52ff;
  text-shadow:0 0 18px #8c32ff;
}

.logo span{
  color:white;
}

.value{
  position:absolute;
  z-index:6;
  top:92px;
  left:0;
  right:0;
  font-size:64px;
  font-weight:900;
  color:#d178ff;
  text-shadow:0 0 25px #8c2eff;
}

.value small{
  font-size:34px;
}

.glow{
  position:absolute;
  width:210px;
  height:210px;
  border-radius:50%;
  background:#8a36ff;
  opacity:.17;
  filter:blur(30px);
  top:120px;
  left:50%;
  transform:translateX(-50%);
}

.jet{
  position:absolute;
  z-index:5;
  top:185px;
  left:50%;
  transform:translateX(-50%) rotate(-12deg);
  font-size:100px;
  filter:drop-shadow(0 10px 12px #000);
}

.rider{
  position:absolute;
  z-index:6;
  top:188px;
  left:50%;
  transform:translateX(-50%);
  font-size:48px;
}

.arc{
  position:absolute;
  width:440px;
  height:180px;
  left:-65px;
  bottom:-75px;
  border-top:7px solid #7e43ee;
  border-radius:50%;
  transform:rotate(-9deg);
  box-shadow:0 -10px 35px #7438e888;
}

.cloud{
  position:absolute;
  bottom:-50px;
  height:110px;
  border-radius:50%;
  background:linear-gradient(#6840c7,#29195c);
}

.c1{
  width:190px;
  left:-50px;
}

.c2{
  width:230px;
  left:95px;
  bottom:-70px;
}

.c3{
  width:190px;
  right:-55px;
}

.caption{
  position:absolute;
  z-index:8;
  bottom:16px;
  left:0;
  right:0;
  font-size:10px;
  letter-spacing:2px;
  color:#d8c8ff;
  font-weight:bold;
}

.status{
  padding:15px 18px 8px;
  color:#a4a8ba;
  font-size:12px;
}

.predict{
  display:block;
  width:calc(100% - 30px);
  margin:7px 15px 18px;
  padding:16px;
  border:0;
  border-radius:15px;
  color:white;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(90deg,#7130ff,#b93eff);
}

.title{
  margin:24px 2px 12px;
  color:#a9adbd;
  font-size:12px;
  font-weight:bold;
}

.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.game{
  padding:14px 5px;
  border-radius:14px;
  border:1px solid #292e42;
  background:#121625;
  color:white;
  font-weight:bold;
}

.game.active{
  background:linear-gradient(90deg,#5622a8,#8435dd);
  border-color:#a15cff;
}

footer{
  margin-top:22px;
  text-align:center;
  color:#6e7387;
  font-size:11px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">🤖 EBOMAFF PREDICTOR</div>
  <div class="online">● ONLINE</div>
</header>

<div class="card">

  <div class="top">
    <h2>🚀 LUCKY JET</h2>
    <div class="ai">EBOMAFF AI</div>
  </div>

  <div class="lucky">

    <div class="stars"></div>

    <div class="logo">
      LUCKY<span>JET</span>
    </div>

    <div class="value">
      --<small>x</small>
    </div>

    <div class="glow"></div>

    <div class="jet">🚀</div>
    <div class="rider">😎</div>

    <div class="arc"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="caption">
      PROCHAINE PRÉDICTION
    </div>

  </div>

  <div id="status" class="status">
    ⌛ Moteur de prédiction non connecté.
  </div>

  <button id="predict" class="predict">
    🔎 PRÉDIRE
  </button>

</div>

<div class="title">🎮 CHOISIR UN JEU</div>

<div class="games">
  <button class="game active">🚀 Lucky Jet</button>
  <button class="game">✈️ Aviator</button>
  <button class="game">💥 Crash</button>
  <button class="game">👑 Rocket Queen</button>
  <button class="game">💣 Mines Classic</button>
  <button class="game">📈 Limbo</button>
  <button class="game">⚽ Penalty</button>
  <button class="game">🚀 Rocket X</button>
  <button class="game">🏎️ Speed & Cash</button>
  <button class="game">🐔 Chicken Train</button>
</div>

<footer>
  EBOMAFF Robot Prediction 🤖<br>
  Moteur d'analyse EBOMAFF
</footer>

</div>

<script>
const button=document.getElementById("predict");
const status=document.getElementById("status");

button.onclick=function(){
  button.disabled=true;
  status.textContent="🔎 Connexion au moteur d'analyse EBOMAFF...";

  setTimeout(function(){
    status.textContent="⌛ Moteur de prédiction non connecté.";
    button.disabled=false;
  },900);
};
</script>

</body>
</html>
