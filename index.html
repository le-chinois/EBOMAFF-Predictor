<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EBOMAFF Predictor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:#060812;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:480px;
  margin:auto;
  padding:18px 15px 35px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.brand{
  font-size:17px;
  font-weight:900;
}

.online{
  color:#4cff9a;
  font-size:12px;
  font-weight:800;
}

.card{
  background:#101326;
  border:1px solid #292d43;
  border-radius:25px;
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.top h2{font-size:21px}

.ai{
  font-size:10px;
  color:#bbb;
  background:#ffffff0d;
  padding:8px 11px;
  border-radius:20px;
}

.screen{display:none}
.screen.active{display:block}

/* =========================
   LUCKY JET
========================= */

.lucky{
  height:390px;
  margin:0 15px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at 50% 53%,
    #521988 0%,#2c1255 35%,#100c27 62%,#070812 100%);
}

.stars{
  position:absolute;
  inset:0;
  opacity:.35;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:42px 42px;
}

.logo{
  position:absolute;
  z-index:10;
  top:22px;
  left:0;
  right:0;
  font-size:31px;
  font-weight:950;
  font-style:italic;
  letter-spacing:-2px;
  color:#bc4cff;
  text-shadow:0 0 12px #a43cff,0 0 28px #6b1ddf;
}

.logo span{color:#fff}

.value{
  position:absolute;
  z-index:10;
  top:91px;
  left:0;
  right:0;
  font-size:63px;
  font-weight:950;
  color:#d47cff;
  text-shadow:0 0 12px #bd4cff,0 0 32px #7c2cff;
}

.value small{font-size:34px}

.glow{
  position:absolute;
  width:230px;
  height:230px;
  top:110px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  background:#8336ff;
  opacity:.20;
  filter:blur(35px);
}

.lucky-character{
  position:absolute;
  z-index:7;
  top:155px;
  left:50%;
  width:185px;
  max-height:190px;
  height:auto;
  transform:translateX(-50%);
  object-fit:contain;
  filter:
    drop-shadow(0 13px 12px rgba(0,0,0,.65))
    drop-shadow(0 0 17px rgba(146,66,255,.55));
}

.arc{
  position:absolute;
  z-index:3;
  width:440px;
  height:180px;
  left:-65px;
  bottom:-74px;
  border-top:7px solid #8246f5;
  border-radius:50%;
  transform:rotate(-9deg);
  box-shadow:0 -7px 20px #8245ff77;
}

.cloud{
  position:absolute;
  z-index:4;
  border-radius:50%;
  background:linear-gradient(#6942c9,#3c257f);
}

.c1{width:180px;height:95px;left:-50px;bottom:-32px}
.c2{width:230px;height:115px;left:95px;bottom:-70px}
.c3{width:190px;height:100px;right:-60px;bottom:-30px}

.caption{
  position:absolute;
  z-index:12;
  bottom:17px;
  left:0;
  right:0;
  text-align:center;
  color:#dacbff;
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
}

.status{
  padding:15px 18px 8px;
  color:#a5a8b8;
  font-size:12px;
}

.predict{
  width:calc(100% - 30px);
  margin:7px 15px 18px;
  padding:16px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(90deg,#7130ff,#b93eff);
}

.predict:active{transform:scale(.98)}

/* =========================
   MINES CLASSIC
========================= */

.mines{
  position:relative;
  margin:0 15px 18px;
  min-height:575px;
  overflow:hidden;
  border-radius:22px;
  padding:18px 14px 88px;
  background:
    radial-gradient(ellipse at 50% 68%,rgba(0,255,90,.55),transparent 34%),
    linear-gradient(180deg,#075bea,#0069ef 45%,#0758dc 75%,#0044b9);
  box-shadow:inset 0 0 45px #00d9ff33;
}

.mines-brand{
  text-align:center;
  font-size:24px;
  font-weight:950;
  text-shadow:0 0 14px #7beeff;
}

.mines-sub{
  text-align:center;
  font-size:12px;
  color:#e8f7ff;
  margin:3px 0 22px;
}

.board{
  max-width:305px;
  margin:auto;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  border:4px solid #fff;
  border-radius:15px;
  background:#6b61d0;
  box-shadow:0 0 5px #fff,0 0 17px #8df4ff,0 0 28px #3eeaffaa;
}

.cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #0750a7;
  border-radius:6px;
  background:linear-gradient(#0872c9,#0753a2);
  box-shadow:inset 0 2px 3px #ffffff22,0 2px 4px #0005;
}

.cell::after{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:#15bce8;
  box-shadow:0 0 6px #00dcff;
}

.cell.star{
  background:linear-gradient(#ffe62d,#ffa500);
  border-color:#fff3a3;
  box-shadow:0 0 10px #ffdc00;
}

.cell.star::after{
  content:"★";
  width:auto;
  height:auto;
  background:none;
  color:#fff;
  font-size:27px;
}

.trap-zone{
  position:relative;
  max-width:305px;
  margin:22px auto 0;
  z-index:5;
}

.trap-zone::before{
  content:"";
  position:absolute;
  z-index:-1;
  width:290px;
  height:145px;
  top:50%;
  left:50%;
  transform:translate(-50%,-45%);
  border-radius:50%;
  background:
    radial-gradient(ellipse,rgba(0,255,89,.78),
    rgba(0,206,81,.30) 42%,transparent 72%);
  filter:blur(8px);
}

.trap-title{
  text-align:center;
  font-size:15px;
  font-weight:900;
  margin-bottom:11px;
  text-shadow:0 0 8px #00ff76;
}

.traps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px 11px;
}

.trap{
  height:42px;
  border:2px solid #e3f8ff;
  border-radius:13px;
  color:#fff;
  background:linear-gradient(#0781d2,#0754a4);
  font-size:15px;
  font-weight:900;
  box-shadow:0 0 6px #69eeff88;
}

.trap.active{
  color:#333;
  background:#fff;
  box-shadow:0 0 9px #fff;
}

.mines-predict{
  display:block;
  width:72%;
  margin:20px auto 0;
  padding:14px;
  border:0;
  border-radius:14px;
  color:#26304b;
  font-size:17px;
  font-weight:900;
  background:linear-gradient(90deg,#fff,#fffbd4,#ffe52b);
  box-shadow:0 0 11px #fff,0 0 25px #ffe52b88;
}

.mines-note{
  text-align:center;
  margin-top:12px;
  font-size:11px;
  color:#e5f5ff;
}

.bomb{
  position:absolute;
  width:112px;
  height:112px;
  left:8px;
  bottom:-24px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,#53629d,#222c5a 30%,#0d1539 60%,#020617 100%);
  box-shadow:
    inset -18px -18px 24px #0008,
    inset 12px 10px 18px #879cff33,
    0 12px 24px #0007;
}

.bomb-cap{
  position:absolute;
  width:30px;
  height:21px;
  left:87px;
  bottom:64px;
  border-radius:6px;
  transform:rotate(28deg);
  background:linear-gradient(90deg,#111832,#8a93ad,#192142);
}

.fuse{
  position:absolute;
  width:54px;
  height:50px;
  left:95px;
  bottom:78px;
  border-top:6px solid #eee;
  border-radius:55%;
  transform:rotate(-22deg);
}

.spark{
  position:absolute;
  left:126px;
  bottom:108px;
  color:#fff342;
  font-size:34px;
  text-shadow:0 0 5px #fff,0 0 10px #ffd900,0 0 18px #ff7300;
}

/* =========================
   AVIATOR - NOUVEAU DESIGN
========================= */

.aviator{
  margin:0 15px 18px;
  height:575px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:#020204;
  border:1px solid #170b21;
}

/* Rayons violets */

.av-rays{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:405px;
  overflow:hidden;
  background:
    conic-gradient(
      from 272deg at 0% 100%,
      transparent 0deg 7deg,
      rgba(63,20,155,.24) 7deg 14deg,
      transparent 14deg 22deg,
      rgba(68,21,168,.28) 22deg 30deg,
      transparent 30deg 40deg,
      rgba(75,23,180,.23) 40deg 50deg,
      transparent 50deg 62deg,
      rgba(75,23,180,.17) 62deg 72deg,
      transparent 72deg 90deg
    );
}

/* Logo */

.aviator-logo{
  position:absolute;
  z-index:6;
  top:17px;
  left:0;
  right:0;
  text-align:center;
  color:#ff003b;
  font-size:43px;
  line-height:1;
  font-weight:950;
  font-style:italic;
  letter-spacing:-3px;
  text-shadow:
    0 0 7px #ff003b,
    0 0 17px rgba(255,0,59,.7);
}

.aviator-logo::after{
  content:"";
  display:block;
  width:132px;
  height:5px;
  margin:8px auto 0;
  border-radius:20px;
  background:#ff003b;
  box-shadow:0 0 10px #ff003b;
  transform:skewX(-28deg);
}

/* Multiplicateur principal */

.av-value{
  position:absolute;
  z-index:8;
  top:125px;
  left:0;
  right:0;
  text-align:center;
  color:#ff315c;
  font-size:58px;
  font-weight:950;
  letter-spacing:2px;
  text-shadow:
    0 0 8px #ff003b,
    0 0 22px rgba(255,0,59,.75);
}

/* Graphique */

.av-graph{
  position:absolute;
  z-index:4;
  left:0;
  right:0;
  top:175px;
  height:235px;
}

.av-graph svg{
  width:100%;
  height:100%;
  display:block;
}

/* Avion */

.av-plane{
  filter:
    drop-shadow(0 0 4px #fff)
    drop-shadow(0 0 9px #ff003b)
    drop-shadow(0 0 18px #ff003b);
}

/* Prédiction */

.av-next{
  position:absolute;
  z-index:10;
  left:17px;
  right:17px;
  top:418px;
  height:76px;
  border:1px solid #a60b32;
  border-radius:17px;
  text-align:center;
  background:#080a12;
  box-shadow:0 0 14px rgba(255,0,59,.17);
}

.av-next-label{
  padding-top:14px;
  color:#d6d7e1;
  font-size:10px;
  letter-spacing:3px;
  font-weight:800;
}

.av-next-value{
  margin-top:5px;
  color:#ff315c;
  font-size:29px;
  line-height:30px;
  font-weight:950;
  text-shadow:0 0 11px #ff003b;
}

/* Bouton Aviator */

.aviator-predict{
  position:absolute;
  z-index:11;
  left:18px;
  right:18px;
  bottom:50px;
  width:calc(100% - 36px);
  height:57px;
  border:0;
  border-radius:17px;
  color:#fff;
  font-size:18px;
  font-weight:950;
  background:linear-gradient(180deg,#12e55b,#00bd3c);
  box-shadow:
    0 0 9px rgba(38,255,105,.65),
    0 0 24px rgba(0,211,72,.38);
}

.aviator-predict:active{transform:scale(.98)}

.aviator-note{
  position:absolute;
  z-index:11;
  left:0;
  right:0;
  bottom:13px;
  text-align:center;
  color:#bfc3d0;
  font-size:11px;
}

.game.aviator-active{
  background:linear-gradient(90deg,#78051d,#d00036);
  border-color:#ff3158;
  box-shadow:0 0 12px #ff174866;
}

/* =========================
   SPEED & CASH
========================= */

.speedcash{
  margin:0 15px 18px;
  height:575px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:#030406;
  border:1px solid #181c26;
}

/* Logo Speed & Cash */

.sc-logo{
  position:absolute;
  z-index:8;
  top:27px;
  left:0;
  right:0;
  text-align:center;
  font-style:italic;
  font-weight:950;
  line-height:.9;
  transform:skewX(-8deg);
}

.sc-speed{
  display:inline-block;
  color:#ff6b16;
  font-size:35px;
  text-shadow:
    0 0 7px rgba(255,105,20,.8),
    0 0 15px rgba(255,69,0,.45);
}

.sc-and{
  display:inline-block;
  margin:0 5px;
  color:#fff;
  font-size:23px;
}

.sc-cash{
  display:inline-block;
  color:#14aaff;
  font-size:35px;
  text-shadow:
    0 0 7px rgba(20,170,255,.8),
    0 0 15px rgba(0,119,255,.45);
}

/* Ligne centrale */

.sc-line{
  position:absolute;
  z-index:2;
  top:93px;
  bottom:78px;
  left:50%;
  width:3px;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 13px,
      transparent 13px 25px
    );
  opacity:.92;
}

/* Valeur toujours au milieu */

.sc-value{
  position:absolute;
  z-index:12;
  top:47%;
  left:50%;
  transform:translate(-50%,-50%);
  min-width:108px;
  padding:8px 11px;
  border-radius:13px;
  text-align:center;
  color:#fff;
  font-size:31px;
  font-weight:950;
  background:#05070bd9;
  text-shadow:0 0 11px rgba(255,255,255,.45);
}

/* Voitures */

.sc-car{
  position:absolute;
  z-index:7;
  top:365px;
  width:67px;
  height:122px;
  border-radius:18px 18px 13px 13px;
  transition:top .8s ease;
  filter:drop-shadow(0 12px 12px #000);
}

.sc-car::before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:20px;
  height:42px;
  border-radius:9px;
  background:linear-gradient(
    180deg,
    rgba(190,235,255,.85),
    rgba(12,24,38,.95)
  );
  border:2px solid rgba(255,255,255,.28);
}

.sc-car::after{
  content:"";
  position:absolute;
  left:15px;
  right:15px;
  bottom:13px;
  height:13px;
  border-radius:8px;
  background:#07090d;
  box-shadow:0 -55px 0 #07090d;
}

.sc-blue{
  left:calc(50% - 105px);
  background:
    linear-gradient(
      90deg,
      #073e75,
      #0b9aff 24%,
      #34c8ff 50%,
      #0b8ae6 76%,
      #052f60
    );
  box-shadow:
    0 0 12px rgba(0,160,255,.55),
    inset 0 0 13px rgba(255,255,255,.25);
}

.sc-red{
  right:calc(50% - 105px);
  background:
    linear-gradient(
      90deg,
      #7c1707,
      #ff431b 24%,
      #ff8a27 50%,
      #ef3516 76%,
      #661006
    );
  box-shadow:
    0 0 12px rgba(255,70,20,.55),
    inset 0 0 13px rgba(255,255,255,.25);
}

/* Petites roues */

.sc-wheel{
  position:absolute;
  width:8px;
  height:24px;
  border-radius:4px;
  background:#050505;
  z-index:6;
}

.sc-wheel.w1{left:-6px;top:24px}
.sc-wheel.w2{right:-6px;top:24px}
.sc-wheel.w3{left:-6px;bottom:20px}
.sc-wheel.w4{right:-6px;bottom:20px}

/* Bouton */

.speed-predict{
  position:absolute;
  z-index:15;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  min-width:145px;
  height:45px;
  padding:0 25px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(180deg,#16cbd0,#078a9b);
  box-shadow:
    0 0 9px rgba(25,224,228,.6),
    0 0 19px rgba(0,181,194,.3);
}

.speed-predict:active{
  transform:translateX(-50%) scale(.98);
}

.speed-note{
  position:absolute;
  z-index:14;
  bottom:73px;
  left:0;
  right:0;
  text-align:center;
  color:#aeb4c2;
  font-size:10px;
}

.speedcash.running .sc-blue{top:150px}
.speedcash.running .sc-red{top:125px}

.game.speed-active{
  background:linear-gradient(90deg,#07516d,#b14313);
  border-color:#18dce5;
  box-shadow:0 0 12px rgba(20,206,224,.4);
}

/* =========================
   MENU
========================= */

.title{
  margin:24px 2px 12px;
  color:#a9adbd;
  font-size:12px;
  font-weight:800;
}

.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.game{
  padding:14px 5px;
  border-radius:14px;
  border:1px solid #292e42;
  background:#121625;
  color:#fff;
  font-size:13px;
  font-weight:800;
}

.game.active{
  background:linear-gradient(90deg,#5622a8,#8435dd);
  border-color:#a15cff;
}

.game.mines-active{
  background:linear-gradient(90deg,#0474d3,#00afe4);
  border-color:#79edff;
}

footer{
  margin-top:22px;
  text-align:center;
  color:#6e7387;
  font-size:11px;
  line-height:1.6;
}

@media(max-width:360px){
  .lucky{height:370px}
  .logo{font-size:28px}
  .value{font-size:57px}

  .lucky-character{
    width:165px;
  }

  .aviator-logo{
    font-size:38px;
  }

  .av-value{
    font-size:51px;
  }

  .sc-speed,.sc-cash{
    font-size:30px;
  }

  .sc-car{
    width:60px;
    height:110px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">🤖 EBOMAFF PREDICTOR</div>
  <div class="online">● ONLINE</div>
</header>

<div class="card">

<div class="top">
  <h2 id="gameTitle">LUCKY JET</h2>
  <div class="ai">EBOMAFF AI</div>
</div>

<!-- =====================
     LUCKY JET
===================== -->

<div id="luckyScreen" class="screen active">

  <div class="lucky">

    <div class="stars"></div>

    <div class="logo">
      LUCKY<span>JET</span>
    </div>

    <div class="value">
      --<small>x</small>
    </div>

    <div class="glow"></div>

    <img
      class="lucky-character"
      src="./luckyjet.png"
      alt="Lucky Jet"
    >

    <div class="arc"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="caption">
      PROCHAINE PRÉDICTION
    </div>

  </div>

  <div id="luckyStatus" class="status">
    ⌛ Moteur de prédiction non connecté.
  </div>

  <button id="luckyPredict" class="predict">
    🔎 PRÉDIRE
  </button>

</div>

<!-- =====================
     MINES CLASSIC
===================== -->

<div id="minesScreen" class="screen">

  <div class="mines">

    <div class="mines-brand">
      MINES ⭐
    </div>

    <div class="mines-sub">
      EBOMAFF MINI-APPLICATION
    </div>

    <div id="board" class="board"></div>

    <div class="trap-zone">

      <div class="trap-title">
        💣 SÉLECTION DE PIÈGES
      </div>

      <div class="traps">
        <button class="trap" data-trap="1">1</button>
        <button class="trap" data-trap="2">2</button>
        <button class="trap active" data-trap="3">3</button>
        <button class="trap" data-trap="4">4</button>
        <button class="trap" data-trap="5">5</button>
        <button class="trap" data-trap="6">6</button>
        <button class="trap" data-trap="7">7</button>
        <button class="trap" data-trap="8">8</button>
      </div>

    </div>

    <button id="minesPredict" class="mines-predict">
      PRÉDIRE
    </button>

    <div id="minesNote" class="mines-note">
      Moteur Mines non connecté.
    </div>

    <div class="bomb"></div>
    <div class="bomb-cap"></div>
    <div class="fuse"></div>
    <div class="spark">✦</div>

  </div>

</div>

<!-- =====================
     AVIATOR
===================== -->

<div id="aviatorScreen" class="screen">

  <div class="aviator">

    <div class="av-rays"></div>

    <div class="aviator-logo">
      Aviator
    </div>

    <div class="av-value">
      --.--x
    </div>

    <div class="av-graph">
