<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EBOMAFF Predictor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#060912;
}

.app{
  max-width:500px;
  margin:auto;
  padding:18px 15px 35px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  font-size:18px;
  font-weight:900;
}

.online{
  color:#4dffa2;
  font-size:12px;
  font-weight:800;
}

.card{
  overflow:hidden;
  border:1px solid #292e43;
  border-radius:28px;
  background:#101426;
  box-shadow:0 20px 50px #0008;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 18px 14px;
}

.game-title{
  font-size:24px;
  font-weight:900;
}

.ai{
  padding:9px 13px;
  border-radius:20px;
  background:#ffffff0d;
  color:#aeb2c4;
  font-size:11px;
}

.stage{
  min-height:390px;
  margin:0 16px;
  border-radius:23px;
  overflow:hidden;
  position:relative;
}

.status{
  padding:15px 20px 8px;
  color:#9da3b7;
  font-size:13px;
}

.predict{
  width:calc(100% - 32px);
  margin:7px 16px 20px;
  padding:17px;
  border:0;
  border-radius:17px;
  color:#fff;
  font-size:17px;
  font-weight:900;
  background:linear-gradient(90deg,#7130ff,#bd39ff);
}

.predict:active{
  transform:scale(.98);
}

.section-title{
  margin:25px 3px 13px;
  color:#a9adbd;
  font-size:13px;
  font-weight:800;
}

.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.game-btn{
  padding:15px 7px;
  border-radius:16px;
  border:1px solid #292e43;
  background:#121625;
  color:#fff;
  font-size:13px;
  font-weight:800;
}

.game-btn.active{
  background:linear-gradient(90deg,#5520a8,#8834e1);
  border-color:#9e55ff;
}

.footer{
  text-align:center;
  color:#6e7488;
  font-size:11px;
  line-height:1.6;
  margin-top:25px;
}

/* BASE */
.sky{
  height:390px;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:linear-gradient(180deg,#15102e,#0a0c1b);
}

.logo{
  padding-top:23px;
  font-size:24px;
  font-weight:950;
  letter-spacing:1px;
}

.big{
  position:absolute;
  z-index:4;
  top:120px;
  left:0;
  right:0;
  font-size:58px;
  font-weight:950;
}

.object{
  position:absolute;
  z-index:3;
  right:18%;
  top:190px;
  font-size:72px;
}

.curve{
  position:absolute;
  width:120%;
  height:170px;
  left:-10%;
  bottom:-60px;
  border-top:5px solid #7846ff;
  border-radius:50% 50% 0 0;
  transform:rotate(-10deg);
}

.stars{
  position:absolute;
  inset:0;
  opacity:.45;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:45px 45px;
}

/* ============================= */
/* LUCKY JET                     */
/* ============================= */

.lucky-new{
  height:390px;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at 50% 50%,#421675 0%,#211044 35%,#0a0919 76%);
}

.lucky-stars{
  position:absolute;
  inset:0;
  opacity:.35;
  background-image:
    radial-gradient(#fff 1px,transparent 1px);
  background-size:42px 42px;
}

.lucky-logo{
  position:absolute;
  z-index:5;
  top:25px;
  left:0;
  right:0;
  font-size:31px;
  font-weight:950;
  font-style:italic;
  letter-spacing:-2px;
  color:#bc4cff;
  text-shadow:
    0 0 12px #a43cff,
    0 0 30px #6b1ddf;
}

.lucky-logo strong{
  color:#fff;
}

.lucky-result{
  position:absolute;
  z-index:7;
  top:100px;
  left:0;
  right:0;
  font-size:62px;
  font-weight:950;
  color:#d27aff;
  text-shadow:
    0 0 12px #b94cff,
    0 0 35px #7b2cff;
}

.lucky-result small{
  font-size:34px;
}

.lucky-glow{
  position:absolute;
  z-index:1;
  width:220px;
  height:220px;
  top:115px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  background:#7c2cff;
  opacity:.18;
  filter:blur(30px);
}

.lucky-jet{
  position:absolute;
  z-index:5;
  top:180px;
  left:50%;
  transform:translateX(-50%) rotate(-12deg);
  font-size:100px;
  filter:
    drop-shadow(0 12px 12px #000)
    drop-shadow(0 0 18px #a34cff);
}

.lucky-person{
  position:absolute;
  z-index:6;
  top:184px;
  left:50%;
  transform:translateX(-50%);
  font-size:55px;
}

.lucky-trail{
  position:absolute;
  z-index:2;
  width:420px;
  height:190px;
  left:-60px;
  bottom:-80px;
  border-top:7px solid #8546ff;
  border-radius:50%;
  transform:rotate(-10deg);
