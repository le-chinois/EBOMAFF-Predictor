<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EBOMAFF Predictor</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 50% 15%,#51288d 0%,#25134d 32%,#090b19 70%);
}

.app{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 35px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  font-weight:900;
  font-size:18px;
}

.online{
  font-size:12px;
  color:#53ffad;
}

.game-card{
  position:relative;
  overflow:hidden;
  min-height:390px;
  padding:22px 18px;
  border-radius:28px;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 50% 45%,rgba(148,70,255,.38),transparent 38%),
    linear-gradient(180deg,#23134d,#0d1025);
  box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.game-name{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
}

.subtitle{
  color:#b7b8cb;
  font-size:13px;
  margin-top:7px;
}

.visual{
  height:175px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.planet{
  position:absolute;
  width:145px;
  height:145px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#b96cff,#6b2ed6 45%,#291264);
  box-shadow:
    0 0 35px rgba(172,84,255,.7),
    0 0 80px rgba(105,45,210,.35);
}

.game-icon{
  position:relative;
  z-index:2;
  font-size:72px;
  filter:drop-shadow(0 12px 15px rgba(0,0,0,.4));
}

.result-label{
  color:#aeb1c5;
  font-size:12px;
  letter-spacing:2px;
}

.result{
  font-size:58px;
  font-weight:950;
  margin:5px 0;
  text-shadow:0 0 25px rgba(165,87,255,.6);
}

.waiting{
  color:#9ca0b8;
  font-size:13px;
  margin-bottom:15px;
}

.predict{
  width:100%;
  border:0;
  border-radius:17px;
  padding:17px;
  font-size:16px;
  font-weight:900;
  color:white;
  background:linear-gradient(90deg,#7b36ff,#b548ff);
  box-shadow:0 12px 30px rgba(126,54,255,.35);
}

.predict:active{
  transform:scale(.98);
}

.games-title{
  margin:23px 2px 12px;
  font-size:14px;
  color:#b6b8c9;
}

.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.game-btn{
  border:1px solid rgba(255,255,255,.09);
  border-radius:15px;
  padding:13px 8px;
  color:white;
  background:#15182b;
  font-size:13px;
  font-weight:700;
}

.game-btn.active{
  background:linear-gradient(90deg,#5523a8,#7c35dc);
  border-color:#9c5cff;
}

.footer{
  text-align:center;
  color:#73778f;
  font-size:11px;
  line-height:1.5;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="brand">🤖 EBOMAFF PREDICTOR</div>
    <div class="online">● ONLINE</div>
  </div>

  <div class="game-card">

    <div id="gameName" class="game-name">LUCKY JET</div>
    <div class="subtitle">Robot Prediction EBOMAFF</div>

    <div class="visual">
      <div class="planet"></div>
      <div id="gameIcon" class="game-icon">🚀</div>
    </div>

    <div class="result-label">PROCHAINE PRÉDICTION</div>

    <div id="result" class="result">--</div>

    <div id="status" class="waiting">
      Appuie sur le bouton pour lancer l'analyse
    </div>

    <button id="predict" class="predict">
      🔎 LANCER L'ANALYSE
    </button>

  </div>

  <div class="games-title">🎮 CHOISIR UN JEU</div>

  <div class="games">

    <button class="game-btn active"
      data-name="LUCKY JET"
      data-icon="🚀"
      data-type="coefficient">
      🚀 Lucky Jet
    </button>

    <button class="game-btn"
      data-name="AVIATOR"
      data-icon="✈️"
      data-type="coefficient">
      ✈️ Aviator
    </button>

    <button class="game-btn"
      data-name="CRASH"
      data-icon="💥"
      data-type="coefficient">
      💥 Crash
    </button>

    <button class="game-btn"
      data-name="ROCKET QUEEN"
      data-icon="👑"
      data-type="coefficient">
      👑 Rocket Queen
    </button>

    <button class="game-btn"
      data-name="MINES CLASSIC"
      data-icon="💣"
      data-type="mines">
      💣 Mines Classic
    </button>

    <button class="game-btn"
      data-name="LIMBO"
      data-icon="📈"
      data-type="coefficient">
      📈 Limbo
    </button>

    <button class="game-btn"
      data-name="PENALTY"
      data-icon="⚽"
      data-type="penalty">
      ⚽ Penalty
    </button>

    <button class="game-btn"
      data-name="ROCKET X"
      data-icon="🚀"
      data-type="coefficient">
      🚀 Rocket X
    </button>

    <button class="game-btn"
      data-name="SPEED & CASH"
      data-icon="⚡"
      data-type="speed">
      ⚡ Speed & Cash
    </button>

    <button class="game-btn"
      data-name="CHICKEN TRAIN"
      data-icon="🐔"
      data-type="coefficient">
      🐔 Chicken Train
    </button>

  </div>

  <div class="footer">
    EBOMAFF Robot Prediction 🤖<br>
    Les prédictions seront calculées par le moteur d'analyse EBOMAFF.
  </div>

</div>

<script>
const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

const gameName = document.getElementById("gameName");
const gameIcon = document.getElementById("gameIcon");
const result = document.getElementById("result");
const status = document.getElementById("status");
const predict = document.getElementById("predict");

let selectedGame = {
  name:"LUCKY JET",
  icon:"🚀",
  type:"coefficient"
};

document.querySelectorAll(".game-btn").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".game-btn")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedGame = {
      name:button.dataset.name,
      icon:button.dataset.icon,
      type:button.dataset.type
    };

    gameName.textContent = selectedGame.name;
    gameIcon.textContent = selectedGame.icon;

    result.textContent = "--";

    status.textContent =
      "Appuie sur le bouton pour lancer l'analyse";

    tg?.HapticFeedback?.selectionChanged();
  });

});

predict.addEventListener("click", () => {

  result.textContent = "...";

  status.textContent =
    "Connexion au moteur d'analyse EBOMAFF...";

  predict.disabled = true;

  setTimeout(() => {

    result.textContent = "EN ATTENTE";

    status.textContent =
      "Le moteur de prédiction sera connecté à l'étape suivante.";

    predict.disabled = false;

    tg?.HapticFeedback?.notificationOccurred("success");

  },1200);

});
</script>

</body>
</html>
