/* =========================
   LUCKY JET
========================= */

.lucky{
  height:390px;
  margin:0 15px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  text-align:center;

  background:
    radial-gradient(circle at 50% 53%,
      #521988 0%,
      #2c1255 35%,
      #100c27 62%,
      #070812 100%);
}

.stars{
  position:absolute;
  inset:0;
  opacity:.35;
  background-image:
    radial-gradient(#fff 1px,transparent 1px);
  background-size:42px 42px;
}

.logo{
  position:absolute;
  z-index:10;
  top:22px;
  left:0;
  right:0;

  font-size:31px;
  font-weight:950;
  font-style:italic;
  letter-spacing:-2px;

  color:#bc4cff;

  text-shadow:
    0 0 12px #a43cff,
    0 0 28px #6b1ddf;
}

.logo span{
  color:#fff;
}

.value{
  position:absolute;
  z-index:10;
  top:91px;
  left:0;
  right:0;

  font-size:63px;
  line-height:1;
  font-weight:950;

  color:#d47cff;

  text-shadow:
    0 0 12px #bd4cff,
    0 0 32px #7c2cff;
}

.value small{
  font-size:34px;
}

.glow{
  position:absolute;
  z-index:1;

  width:230px;
  height:230px;

  top:110px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:#8336ff;
  opacity:.20;
  filter:blur(35px);
}

.lucky-character{
  position:absolute;
  z-index:7;

  top:155px;
  left:50%;

  width:185px;
  max-height:190px;
  height:auto;

  transform:translateX(-50%);
  object-fit:contain;

  filter:
    drop-shadow(0 13px 12px rgba(0,0,0,.65))
    drop-shadow(0 0 17px rgba(146,66,255,.55));
}

.arc{
  position:absolute;
  z-index:3;

  width:440px;
  height:180px;

  left:-65px;
  bottom:-74px;

  border-top:7px solid #8246f5;
  border-radius:50%;

  transform:rotate(-9deg);

  box-shadow:
    0 -7px 20px #8245ff77,
    0 -18px 50px #6b32d955;
}

.cloud{
  position:absolute;
  z-index:4;
  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      #6942c9,
      #3c257f
    );

  box-shadow:0 0 30px #6838d755;
}

.c1{
  width:180px;
  height:95px;
  left:-50px;
  bottom:-32px;
}

.c2{
  width:230px;
  height:115px;
  left:95px;
  bottom:-70px;
}

.c3{
  width:190px;
  height:100px;
  right:-60px;
  bottom:-30px;
}

.caption{
  position:absolute;
  z-index:12;

  bottom:17px;
  left:0;
  right:0;

  text-align:center;

  color:#dacbff;
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
}

/* =========================
   MINES CLASSIC
========================= */

.mines-screen{
  display:none;
  position:relative;

  margin:0 15px;
  min-height:570px;

  padding:19px 15px 0;

  border-radius:22px;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 72%,
      rgba(0,255,90,.55) 0%,
      rgba(0,221,82,.25) 18%,
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #075de9 0%,
      #0069ee 42%,
      #0759dd 73%,
      #0045bd 100%
    );

  box-shadow:
    inset 0 0 45px rgba(0,229,255,.22);
}

.mines-screen.active{
  display:block;
}

.mines-title{
  position:relative;
  z-index:5;

  text-align:center;

  font-size:23px;
  font-weight:950;

  margin-bottom:3px;

  text-shadow:
    0 2px 3px rgba(0,0,0,.35),
    0 0 12px rgba(255,255,255,.25);
}

.mines-subtitle{
  position:relative;
  z-index:5;

  text-align:center;

  color:#e4f5ff;
  font-size:12px;

  margin-bottom:25px;
}

/* GRILLE */

.mines-board{
  position:relative;
  z-index:6;

  width:100%;
  max-width:310px;

  margin:0 auto 20px;
  padding:8px;

  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;

  border:4px solid #fff;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #766bd2,
      #5c56c5
    );

  box-shadow:
    0 0 5px #fff,
    0 0 15px #8ff5ff,
    0 0 28px rgba(81,236,255,.90);
}

.mine-cell{
  position:relative;

  aspect-ratio:1/1;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #0750a7;

  border-radius:5px;

  background:
    linear-gradient(
      180deg,
      #0871c8,
      #0755a5
    );

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.15),
    0 2px 4px rgba(0,0,0,.32);
}

.mine-cell::after{
  content:"";

  width:12px;
  height:12px;

  border-radius:50%;

  background:#15bce8;

  box-shadow:
    inset 0 0 4px #7cf3ff,
    0 0 6px #00d9ff;
}

/* CASE ÉTOILE */

.mine-cell.star{
  border-color:#fff0a2;

  background:
    linear-gradient(
      180deg,
      #ffe52b,
      #ffa500
    );

  box-shadow:
    0 0 5px #fff,
    0 0 13px #ffdc00;
}

.mine-cell.star::after{
  content:"★";

  width:auto;
  height:auto;

  background:transparent;

  color:#fff;

  font-size:28px;

  text-shadow:
    0 0 4px #fff,
    0 0 8px #fff;
}

/* SÉLECTION DES PIÈGES */

  position:relative;
  z-index:6;

  padding:5px 0 14px;
}

  filter:blur(8px);
}

.trap-title{
  text-align:center;

  margin-bottom:11px;

  color:#fff;

  font-size:15px;
  font-weight:900;

  text-shadow:
    0 2px 2px rgba(0,0,0,.35),
    0 0 8px #00ff76;
}

  gap:8px 11px;
}
